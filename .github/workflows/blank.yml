# This is a basic workflow to help you get started with Actions

name: Test

# Controls when the workflow will run
on:
  # Triggers the workflow whenever a label is created, edited, or deleted (src: https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#using-event-activity-types)
  label:

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  zrt05-exfil:
    runs-on: ubuntu-latest
    env:
      ENC: ${{ secrets.ENC }}
      TEST_SECRET_OHMY: ${{ secrets.TEST_SECRET_OHMY }}
    steps:
      - uses: actions/checkout@v2
      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: |
          echo "Test is: $(echo $TEST_SECRET_OHMY | openssl aes-256-cbc -a -salt -pass pass:$ENC)"
